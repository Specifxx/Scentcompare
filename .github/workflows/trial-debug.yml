# Temporary: dumps a few product pages' JSON-LD (removed before merge).
name: Trial debug
on:
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/trial-debug.yml"]
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"
          for u in https://www.pacoperfumerias.co.uk/fragrance/womens/fragrance/calvin-klein/ck-one-shock-for-her.html https://www.seurenhealth.de/beauty-health/dufte/damen-dufte/kenzo/l-eau-par-kenzo/; do
            echo "=== $u"; curl -sL -A "$UA" "$u" | tr '\n' ' ' | grep -o '<script[^>]*ld+json[^>]*>.\{0,2500\}' | head -4; sleep 2
          done
          for u in https://maisondesfragrances.fr/robots.txt https://maisondesfragrances.fr/sitemap.xml https://www.parfimo.de/robots.txt https://www.parfum-zentrum.de/robots.txt; do
            echo "=== $u"; curl -sL -A "$UA" "$u" | head -c 1500; echo; sleep 2
          done
          echo "=== maison child"; c=$(curl -sL -A "$UA" https://maisondesfragrances.fr/sitemap.xml | grep -o '<loc>[^<]*product[^<]*</loc>' | head -1 | sed 's/<[^>]*>//g;s/&amp;/\&/g'); echo "$c"; curl -sL -A "$UA" "$c" | head -c 800
          echo "=== parfimo sitemap"; curl -sL -A "$UA" https://www.parfimo.de/sitemap.xml | head -c 1200
